version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imovies-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - CLIENT_URL=http://localhost:80
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-imovies_super_secure_jwt_access_secret_2026_key}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-imovies_super_secure_jwt_refresh_secret_2026_key}
      - SEAT_LOCK_EXPIRY_MINUTES=10
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - imovies-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imovies-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - imovies-net

networks:
  imovies-net:
    driver: bridge

volumes:
  backend-uploads:
